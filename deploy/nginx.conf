server {
    listen 80;
    listen [::]:80;
    server_name land.portalwiki.world;
    location /.well-known/acme-challenge/ { root /var/www/opslands-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name land.portalwiki.world;
    ssl_certificate /etc/letsencrypt/live/land.portalwiki.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/land.portalwiki.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /auth/opsvault/ {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
